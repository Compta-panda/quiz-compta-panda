<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Statistiques du quiz</title>
<style>
:root{--bg:#141027;--card:#f5ecd7;--ink:#2a2140;--gold:#e2bc62;--muted:#6b5f80}
body{margin:0;background:var(--bg);color:var(--card);font-family:Georgia,serif;padding:32px 16px}
.wrap{max-width:560px;margin:auto}
h1{color:var(--gold);font-size:26px;margin:0 0 6px}
p{margin:0 0 20px;color:#cfc6e0}
table{width:100%;border-collapse:collapse;background:var(--card);color:var(--ink);border-radius:6px;overflow:hidden}
td{padding:12px 16px;border-bottom:1px solid #d9c9a3;font-size:18px}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:bold}
tr.total td{background:#efe2c0}
button{margin-top:16px;font:inherit;background:var(--gold);color:var(--ink);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
</style></head><body><div class="wrap">
<h1>🎩 Le Chapeau des Comptes : statistiques</h1>
<p>Compteurs en direct du quiz. Mis à jour à chaque chargement de cette page.</p>
<table id="t"><tbody></tbody></table>
<button type="button" id="r">Actualiser</button>
<p id="d" style="margin-top:12px;font-size:14px"></p>
</div>
<script>
const NS="compta-panda-chapeau";
const ROWS=[["visites","Quiz ouverts"],["reponses","Quiz terminés"],["pandor","🦁 Pandor"],["bamboufsouffle","🦡 Bamboufsouffle"],["serpentaxe","🐍 Serpentaxe"],["serdebit","🦅 Serdébit"],["rdv","Clics « Prendre rendez-vous » depuis le quiz"]];
async function load(){
  const tb=document.querySelector("#t tbody"); tb.innerHTML="";
  for(const [k,label] of ROWS){
    let v="…";
    try{const r=await fetch("https://abacus.jasoncameron.dev/get/"+NS+"/"+k); v=r.ok?(await r.json()).value:0;}catch(e){v="?"}
    const tr=document.createElement("tr"); if(k==="reponses") tr.className="total";
    tr.innerHTML="<td></td><td class='n'></td>"; tr.cells[0].textContent=label; tr.cells[1].textContent=v; tb.appendChild(tr);
  }
  document.getElementById("d").textContent="Relevé du "+new Date().toLocaleString("fr-FR");
}
document.getElementById("r").onclick=load; load();
</script></body></html>
